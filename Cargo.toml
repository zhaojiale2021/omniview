[package]
name = "my-project"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = "0.30"
wgpu = "24"
pollster = "0.4"
ffmpeg-next = { version = "7", optional = true }
egui = "0.29"
egui-winit = "0.29"
egui-wgpu = "0.29"
rfd = "0.15"
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
decoder = ["dep:ffmpeg-next"]
