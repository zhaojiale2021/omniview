[package]
name = "omniview"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = "0.30"
wgpu = "22"
pollster = "0.4"
cpal = "0.15"
	# In-process video/audio decoding (replaces the ffmpeg-CLI pipe — gives true
	# pause/resume like native players).  Version tracks FFmpeg major: 8.x.
	# software-resampling enables swr for audio resampling to cpal output.
	# filter enables the atempo audio filter for speed control.
	ffmpeg-next = { version = "8.0", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling", "filter"] }
egui = "0.29"
egui-winit = "0.29"
egui-wgpu = "0.29"
rfd = "0.15"
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Screenshot → PNG
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Release builds: smaller binary + faster runtime at the cost of longer
# compile/link time.
#
# `panic = "abort"` is deliberately NOT set: media/audio.rs uses
# catch_unwind to keep the audio pipeline alive if an FFI/filter bug panics,
# which abort-on-panic would defeat.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
