name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg pkg-config clang libclang-dev \
            libasound2-dev \
            libx11-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev \
            libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev libswscale-dev libswresample-dev

      - name: Generate test fixtures
        run: bash scripts/gen-test-fixtures.sh

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all --check

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Download BtbN FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force third_party/btbn | Out-Null
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath third_party/btbn

      - name: cargo build (native Windows)
        env:
          FFMPEG_DIR: ${{ github.workspace }}/third_party/btbn/ffmpeg-n8.1-latest-win64-gpl-shared-8.1
        run: cargo build --all-targets
