name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg pkg-config clang libclang-dev \
            libasound2-dev \
            libx11-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev \
            libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev libswscale-dev libswresample-dev

      - name: Generate test fixtures
        run: bash scripts/gen-test-fixtures.sh

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all --check

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Download BtbN FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force third_party/btbn | Out-Null
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath third_party/btbn

      - name: cargo build (native Windows)
        env:
          FFMPEG_DIR: ${{ github.workspace }}/third_party/btbn/ffmpeg-n8.1-latest-win64-gpl-shared-8.1
        run: cargo build --all-targets

  # 汇总门禁:分支 ruleset 只要求 "CI required" 这一个稳定的检查名,
  # 以后增删作业或给作业改名,都不用回头改 ruleset。
  gate:
    name: CI required
    runs-on: ubuntu-latest
    needs: [build, fmt, windows]
    if: always()
    steps:
      - name: 所有上游作业都成功才算通过
        run: |
          echo "build=${{ needs.build.result }} fmt=${{ needs.fmt.result }} windows=${{ needs.windows.result }}"
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.fmt.result }}" != "success" ] || [ "${{ needs.windows.result }}" != "success" ]; then
            echo "::error::上游作业失败或被取消,门禁不通过"
            exit 1
          fi
